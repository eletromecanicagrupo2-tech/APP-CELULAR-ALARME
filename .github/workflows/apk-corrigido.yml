name: Gerar APK corrigido
on:
  push:
    branches: [alarm-with-photo-of-vase-4bc0a]
    paths: ['.github/workflows/apk-corrigido.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar APK
        working-directory: AlarmeVaso
        run: APP_DIR="$PWD" sh gradlew --no-daemon assembleDebug
      - name: Publicar APK de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp AlarmeVaso/app/build/outputs/apk/debug/app-debug.apk AlarmeVaso-corrigido.apk
          gh release create "teste-${GITHUB_SHA:0:8}" AlarmeVaso-corrigido.apk --target "$GITHUB_SHA" --prerelease --title "Alarme Vaso corrigido" --notes "APK de teste com a correção ao ativar o alarme."
